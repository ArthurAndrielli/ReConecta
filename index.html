<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ReConecta</title>
  <script>
    // Apply only presentation preferences before the first paint.
    (() => {
      const root = document.documentElement;
      const system = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      try {
        const preferences = JSON.parse(localStorage.getItem('reconecta_preferences') || '{}') || {};
        root.dataset.appearance = ['light', 'dark'].includes(preferences.appearance) ? preferences.appearance : system;
        root.dataset.textSize = preferences.textSize === 'large' ? 'large' : 'standard';
        root.classList.toggle('reduce-motion', preferences.reduceMotion === true);
      } catch { root.dataset.appearance = system; }
    })();
  </script>
  <link rel="stylesheet" href="./src/css/style.css">
</head>
<body>
  <a class="skip-link" href="#app">Pular para o conteúdo</a>
  <div class="site-shell">
  <header class="site-header">
    <div class="brand"><span class="brand-mark" aria-hidden="true">◌</span><span class="brand-name">ReConecta</span></div>
    <p>Atividades cognitivas e de linguagem</p>
  </header>
  <nav class="global-nav" aria-label="Navegação principal">
    <a href="#/inicio" data-nav="inicio" aria-current="page">Início</a>
    <a href="#/atividades" data-nav="atividades">Atividades</a>
    <a href="#/evolucao" data-nav="evolucao">Minha evolução</a>
    <a href="#/ajustes" data-nav="ajustes">Ajustes</a>
  </nav>
  </div>
  <aside id="storage-status" role="status" hidden></aside>
  <main id="app" tabindex="-1"></main>
  <noscript><p>Ative o JavaScript no navegador para usar as atividades do ReConecta.</p></noscript>
  <script type="module" src="./src/js/app.js"></script>
</body>
</html>
